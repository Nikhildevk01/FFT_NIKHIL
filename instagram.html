<html>

<head>

    <title>Instagram</title>

    <style>
        form {

            border: 2px solid black;
            width: 400px;
            margin-left: 550px;
            margin-top: 50px;
            background-color: rgb(253, 100, 223);
            border-radius: 10px;
            box-shadow: 2px 4px 8px black;

        }

        input {
            border: 1px;
        }

        h1 {

            text-align: center;
            font-family: 'Billabong', cursive;
            font-size: 40px;

        }

        #i1 {

            width: 250px;
            height: 40px;
            margin-left: 70px;
            background-color: rgb(245, 227, 227);
            border-radius: 10px;
        }

        #i2 {

            width: 250px;
            height: 40px;
            margin-left: 69px;
            background-color: rgb(245, 227, 227);
            border-radius: 10px;

        }

        #i3 {

            display: block;
            text-align: center;
            color: rgb(71, 11, 210);
        }

        #i4 {

            display: block;
            text-align: center;
            color: blue;
            font-weight: bold;
        }

        #i5 {

            display: block;
            text-align: center;
            color: rgb(45, 31, 243);
            font-weight: bold;

        }

        #b1 {

            width: 250px;
            height: 40px;
            margin-left: 69px;
            background-color: blue;
            color: aliceblue;
            border-radius: 10px;
        }

        #b1:hover {

            background-color: rgb(220, 131, 179);
        }

        #b2 {

            width: 250px;
            height: 40px;
            margin-left: 69px;
            background-color: green;
            color: aliceblue;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        #b2:hover {

            background-color: rgb(188, 223, 151);
        }
    </style>
</head>

<body>


    <form>

        <h1>Instagram Login</h1>
        <br><br>
        <br>
        <input type="email" id="i1" required placeholder="Phone number, email or username">
        <br><br>
        <input type="password" id="i2" required placeholder="Password">
        <br><br><br><br>
        <button id="b1">Login</button>
        <br>
        <br>
        <label id="i3">Forgot your login details?</label>
        <br>
        <hr>
        <br>
        <label id="i4">Login with facebook</label>
        <br>
        <hr><br>
        <label id="i5">Don't have an account?</label>


        <br><br><br>
        <button id="b2">Create new account</button>



    </form>

</body>

</html>
