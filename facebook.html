<html>

<head>

  <title>Facebook</title>

  <style>
    form {

      border: 2px solid black;
      width: 400px;
      margin-left: 550px;
      margin-top: 140px;
      background-color: rgb(150, 234, 234);
      border-radius: 10px;
      box-shadow: 2px 4px 8px black;

    }

    h1 {

      text-align: center;

    }

    #i1 {

      width: 250px;
      height: 40px;
      margin-left: 70px;

    }

    #i2 {

      width: 250px;
      height: 40px;
      margin-left: 69px;

    }

    #i3 {

      display: block;
      text-align: center;

      width: 250px;
      height: 40px;
      margin-left: 69px;
      background-color: blue;
      color: aliceblue;

  <form>

    <button id="b1">Login</button>
    <br>
    <br>

  </form>
